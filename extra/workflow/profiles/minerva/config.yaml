# Snakemake workflow profile for the minerva cluster, used by
# run_pipeline.sbatch next to this file.
#
# The whole pipeline runs inside one Slurm job that holds one GPU for at most
# a day: Snakemake runs in that job, inside the Apptainer image, and starts
# the pipeline steps on the allocated node. See docs/tutorials/minerva.md.

# One step at a time, so that steps do not compete for the GPU. Pass
# `--cores 2` (up to the job's 4 CPUs) to run two steps at once; they then
# share the GPU and its memory.
cores: 1

# A failed step (for example a training run stopped by the time limit) does
# not stop the others, and steps cut off by the time limit start over in the
# next job. Training scripts with checkpoints continue from the latest one.
keep-going: true
rerun-incomplete: true

# Only rerun steps whose inputs are newer than their outputs, not when code or
# parameters change. Datasets or other outputs copied from another machine
# are then reused, which matters because compute nodes cannot download data.
# Rerun steps on purpose with --forcerun.
rerun-triggers: mtime
